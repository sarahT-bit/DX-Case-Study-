  <script id="185" type="text/markdown">

    Before you even start coding, you have to have knowledge of HOW to structure your code. That way, the computer can understand it. In the Computer Science world, this is known as syntax. This word sounds intimidating when you first read it, but don't worry! It's actually easier than you think.  


    **Syntax:**
    - This essentially means the 'grammar rules' of programming.

    For instance, when writing a school paper, you end sentences with periods. In Javascript, statements end with semicolons(;). More than the semicolon, other syntax rules are: 

    - **Parenthesis():** Think of these as **INSTRUCTIONS**. These are used whenever we want to PASS information to a function (just like the math order of operations).

    - **Curly braces** **{}:** Think of these as **PARAGRAPHS**. These are used to group MULTIPLE lines of code together into a single "block" of logic so they run together.
    - **Comments(//):** Think of these as **'ADDITIONAL NOTES'** you want to add to your code. Writing these out help you understand what your code is doing and doesn't effect your overall program when you run it.
    - **Characters('abc'):** These are words inside SINGLE quotation marks.
    - **Strings:("hello")** These are words inside FULL quotation marks. 

  </script>

  <script id="105" type="application/vnd.observable.javascript" pinned="">
    // Here are individual nodes listed below:

    {
    const node1 = {value: 3, next:null }; // node1 had a value of 3
    const node2 = {value: 8, next:null }; // node2 has a value of 8
    const node3 = {value: 93, next:null }; // node3 has a value of 93

    node1.next = node2; // the value 3 is going to point to 8
    node2.next = node3; // the value 8 will point to 93

    //The STARTING point of the linked list
    const head = node1; 

    let listOutput = ""; // builds out visual chain layout
    let currentNode = head; // starts POINTER at beginning of the list

    while(currentNode !== null){
      listOutput +=currentNode.value + "->"; // adds the current value to our text
      currentNode = currentNode.next; // moves pointer to the next node
    }
    listOutput += "null"; // end of list
    return listOutput; // returns the whole sequence at the SAME time
    }
  </script>

    # **Chapter Three: Object Oriented Programming (OOP)**

    This approach organizes our software around **OBJECTS** rather than **FUNCTIONS** and **LOGIC**. 

    **Concepts of OOP:**

    - **Classes:** Think of a blueprint that construction workers use to see the exact layout, dimensions, and features of a building.

    - **Objects:** The ACTUAL physical building constructed from that blueprint.

    - **Properties:** The CHARACTERISTICS of the building such as its address or wall color.

    - **Methods:** The things the building can DO (or have happen to it) such as opening the front security gates.

    Consider the example code below
  </script>
  <script id="284" type="application/vnd.observable.javascript" pinned="">
    {
      // The blueprint (Class)
      class Building {
        constructor(address, color) {

          // the properties 
          this.address = address; 
          this.color = color;     
        }

        // The Method (what has HAPPENED to the building)
        describe() {
          return "The building at " + this.address + " is painted " + this.color + ".";
        }
      }

      // The Object that was created from the Class 

      const skyscraper = new Building("555 Market St", "glass and silver");

      // Return the description of our skyscraper object
      return skyscraper.describe();

    //CHALLENGE: Add more properties and change the text inside the 'const skyscrpaer' line. 

    //Notice how the output changes! 
    }
  </script>
  <script id="288" type="text/markdown">
    **Encapsulation:**

    - Ensures that any internal 'sensitive' data is HIDDEN from outside interference.



    NOTE: In programming, this doesn't just hide from end users, but also from other programmers(also called developers)to prevent them from accidentally breaking the object.


    Imagine this: 

    - When you're using a vending machine, you're not thinking too hard about the 'mechanics' of the machine. Your focus is just paying a certain amount to get a snack/s. 

    - The machine's external shell encapsulates the internal cash vault.That way, people can't reach inside the machine and try to steal money or change the inventory. 


    Consider the example below
  </script>
  <script id="308" type="application/vnd.observable.javascript" pinned="">
    { // Curly brace STARTS the capsule block

      class VendingMachine {
        // The '#' encapsulates this inventory, making it strictly PRIVATE
        // NOTE: If you want to hide anything, make sure to declare it in the BEGINNING of the program! 
        #snackCount = 50; 

        // An approved, public "button" to safely buy a snack
        purchaseSnack() {
          if (this.#snackCount > 0) {
            this.#snackCount--; // subtract snackCount by ONE 
            return "Enjoy your snack! Snacks left: " + this.#snackCount;
          }
          return "Out of stock!";
        }
      }

      const machine = new VendingMachine();

      // CHALLENGE: Try to reach inside and wildly change the inventory by uncommenting the line below!
      //machine.#snackCount = 100; 

      // Using the approved public button instead:
      return machine.purchaseSnack();

    } // Curly brace ENDS the capsule block
  </script>

    -  Unlike Encapsulation, Abstraction focuses on simplifying things so that you're not thrown off by complexity

    Imagine this: 
    - When you're driving down the road and want to increase your speed, you know to just press your foot a little more on the gas pedal. You're not thinking too hard about the logistics behind it such as how many milimeters of fuel are injected into the engine cylinders. 

  </script>
  <script id="329" type="text/markdown">
    **Inheritance:**
    - Allows one object or class to inherit the properties/methods from ANOTHER class.

    For instance, a child inherits characteristics such as eye color or their last name from their parents while they have their OWN unique traits (such as playing sports or the guitar). 

    - In programming, Inheritance is done so that you don't have to rewrite the "parent's" features from scratch anytime you want to write something new. 
  </script>
  <script id="336" type="text/markdown">
    **Polymorphism:**

    - This is known as “many forms”. Meaning, that it allows DIFFERENT objects to respond to the SAME method call in their OWN way.

    For example, imagine yourself making an online cart off of a website. When making your payment, there's different payment options: Credit card, PayPal, Bitcoin, etc. They all perform the SAME action, but the WAY they each do it behind the scenes is done in DIFFERENT ways. 



  </script>

  <script id="374" type="text/markdown">
    - To recap, we have addressed the fundamentals of programming, data structures, and object oriented programming.


    - While these concepts are essential, it leaves room for the main question: **WHERE do I even write this code?**

    - Answer: There are various ways to do this. From online compilers such as Programiz to an Integrated Development Environment (also called IDE) such as InteliJ.


    However, the one I'm going to introduce you to are tools both Computer Science students and Software Developers at major tech companies use:
    -   **VS Code (where users WRITE code)**
    -    **Github (where users SAVE and SHARE it)**

    **What is Github?**

    <img src ="${await FileAttachment("Screen Shot 2026-07-09 at 4.28.24 PM.png").url()}" width="400" alt="Screen Shot">

    - A cloud-based platform where developers can store, manage, track, and collaborate on their code.

    You may be thinking "what makes Github so popular anyway?". 

    Long story short, **think of Github as essentially Google Docs, but it's designed specifically for CODE. **

    **Main Features:**
    - **Storing & Managing:** Rather than saving your project files on your local computer or USB drive, your code is SAFELY backed up in the cloud and you can access your work from ANY computer in the world.


    - **Tracking:** Just like in Google Docs where you can view the 'Version History' of your document to find out who added a specific paragraph or revert back to what your document looked like yesterday, Github can keep a PERFECT timeline of every single change you make.

    NOTE: If your code BREAKS, you can use the history to go back to a working version.

    - **Collaborating:** When working on a team project, emailing files back and forth is NOT sufficient. Github allows MULTIPLE people to work on the EXACT SAME project simultaneously. You are able to merge code smoothly and review each other's work BEFORE making it official (via opening what's called a 'Pull Request'). 

    When using Github, you will come across the word **Repository (or repo)**. This just means a PROJECT FOLDER where you can store your work. 

    **How To Implement Code into Github:**

    Format:

    *insert the name of file*. *insert programming language being used* 

    It's important to abbreviate what programming language you are using! This is called the **File Extension!**

    **For Web Development Core:**
    - **.html (Hypertext Markup Language; the skeleton of a webpage)**
    - **.css (Cascading Style Sheets ; the styling/design of a webpage)**
    - **.js (JavaScript ; ensures interactivity to the webpage)**

    **For General Purposes:**
    - **.py (Python)**
    - **.java (Java)**
    - **.c (C)**
    - **.cs (C#)**
    - **.rb (Ruby)**
    - **.rs(Rust)**
    - **.go(Go)**

    **CRITICAL RULES FOR FILENAMES:**

    - Make sure that file extensions are in LOWERCASE! Github is case sensitive! Meaning, that if you typed "script.JS", it can confuse code editors!

    - Don't use ANY SPACES either when naming your files (hyphens and camelCase are allowed however. For instance, my-code.js or myCode.js).

    **Once you are DONE writing or pasting code in the programming language you chose, make sure to click 'Commit Changes' to SAVE your work!**

    **To Make Modifications To Code In The Future: **
    - Click on the file name
    - Click on the 'pencil' icon
    - Once done with edits, click 'Commit Changes' again

    **Markdown Files (md): What are they?**
    - They're essentially files that you can make when wanting to write or paste TEXT rather than CODE.

    **How To Set One Up:**
    - After clicking 'New Repository', Github asks with a checkbox: "Add a README file". From there, your README.md will be in your project folder. 


    **To make more (if needed):**
    - Click on the '+' button

    - Select 'Create New File' from the drop down menu 

    - Format the name of the file as *name of file*.md

    - Click on 'Commit Changes'

    From there, it will show up on your project folder! 



  </script>

  <script id="427" type="text/markdown">
    **VS Code:**

    - An open source code editor

    You may be thinking, " what makes this different from a  regular text editor?" 

    It consists of these 2 things: 
    - **Syntax Highlighting:** When typing out code, the platform will COLOR CODE the text. Variables, functions, and loops get their OWN color.

    This makes it easier for the developer to catch typos and read their logic.

    - **IntelliSense (Auto-complete):** VS Code essentially tries to guess what the developer is coding, so it can finish what they are trying to say.

    **Think of the autocorrect function when typing a text message to someone**. 

    When opening VS Code, the developer comes across this page:

    - **The Sidebar (File Explorer):** This showcases the EXACT folder structure of the project. From the image above, you can see the file extensions (.html, .js, and .json) and click to view them (.md can be included as well). 

    - **The Editor Window (The Center):** This is where you ACTUALLY type and edit your code. You are also able to open MULTIPLE tabs side by side to look at HTML and Javascript at the SAME time.

    - **The Terminal (The Bottom Panel):** This is where you RUN commands to PUSH your project files to Github. I'll go into more detail further below.

    - Because of its **Extensions Marketplace**. Think of it as an app store for your code editor.
