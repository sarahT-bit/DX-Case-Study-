<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Observable Notebook</title>
  <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/@observablehq/inspector@5/dist/inspector.css">
</head>
<body>
  <div id="observablehq-notebook"></div>

  <script type="module">
    import {Runtime, Inspector} from "https://cdn.jsdelivr.net/npm/@observablehq/runtime@5/dist/runtime.js";
    import define from "https://api.observablehq.com/d/9ca600b2c8f4ad94.js?v=3";
    
    new Runtime().module(define, Inspector.into("#observablehq-notebook"));
  </script>
</body>
</html>
